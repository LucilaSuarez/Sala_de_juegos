<div class="contenedor-juego">
    <h4>¿Mayor o menor? 📈📉</h4>
    @if(cartaActual){
        <div class="carta">
            <img
                [src]="cartaActual.image"
                [alt]="cartaActual.value"
            >
        </div>
    }
    <p>La carta siguiente es ....</p>
    <div class="botones">
        <button type="button" class="btn btn-dark w-100" (click)="jugar('mayor')">
            Mayor
        </button>
        <button type="button" class="btn btn-dark w-100" (click)="jugar('menor')">
            Menor
        </button>
    </div>
    <p>Puntaje: {{ puntaje }}</p>
</div>

@if(juegoTerminado){
    <div class="modal-overlay">
        <div class="modal-fin">
            <h2>¡Juego terminado!</h2>
            <p>Acertaste {{ puntaje }}/{{ maxIntentos }}</p>
            <div class="modal-botones">
                <button class="btn btn-dark" (click)="reiniciarJuego()">Volver a jugar</button>
                <button class="btn btn-dark" routerLink="/home">Ir al Home</button>
            </div>
        </div>
    </div>
}
