<div class="contenedor-juego">
    <h4>Ahorcado</h4>

    <!-- Barra de estado -->
    <div class="botones">
        <span>⏱️ {{ tiempoSegundos }}s | </span>
        <span>❌ {{ intentosFallidos }}/{{ maxIntentos }}</span>
    </div>

    <div class="pantalla-ahorcado">
        <img [src]="imagenActual" alt="Estado del ahorcado">
    </div>

    <div class="palabra-secreta">
        {{ palabraOculta }}
    </div>

    <!-- Teclado -->
    <div class="teclado"> 
        @for (letra of abecedario; track letra) {
            <button 
                type="button" [disabled]="letrasSeleccionadas.has(letra) || 
                juegoTerminado" (click)="seleccionarLetra(letra)"> {{ letra }}
            </button>
        }
    </div>
</div>


@if (juegoTerminado) {
    <div class="modal-overlay">
        <div class="modal-fin">
            <h2>¡Partida terminada!</h2>
            <p>{{ resultadoMensaje }}</p>
            <p style="font-size: 1rem; color: #4b5563;">Tiempo total: {{ tiempoSegundos }}s | Letras: {{ letrasTotalesPulsadas }}</p>
            <div class="modal-botones">
                <button class="btn btn-dark" (click)="iniciarJuego()">Volver a jugar</button>
                <button class="btn btn-dark" routerLink="/home">Ir al Home</button>
            </div>
        </div>
    </div>
}
