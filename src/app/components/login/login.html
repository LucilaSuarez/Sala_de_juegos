<div class="login-container">
    <div class="login-card">
        <h2 class="mb-4 text-center">
            Iniciar sesión
        </h2>

        <form (ngSubmit)="onSubmit()">
            @if(errorMensaje()) {
                <div class="alert alert-danger">
                    {{ errorMensaje() }}
                </div>
            }

            <div class="mb-3">
                <input
                    type="email"
                    class="form-control"
                    [(ngModel)]="email"
                    name="email"
                    placeholder="Correo electrónico"
                    required
                >
            </div>

            <div class="mb-3">
                <input
                    type="password"
                    class="form-control"
                    [(ngModel)]="password"
                    name="password"
                    placeholder="Contraseña"
                    required
                >
            </div>

            <button type="submit"class="btn btn-dark w-100" [disabled]="loading()">
                @if (loading()) {
                    Cargando...
                } @else {
                    Ingresar
                }
            </button>
            <div class="d-flex gap-2 mt-2">
                <button type="button" class="btn btn-dark w-100" (click)="autocompletar(0)">
                    Usuario 1
                </button>
                <button type="button" class="btn btn-dark w-100" (click)="autocompletar(1)">
                    Usuario 2
                </button>
                <button type="button" class="btn btn-dark w-100" (click)="autocompletar(2)">
                    Usuario 3
                </button>
            </div>
        </form>
    </div>
</div>
